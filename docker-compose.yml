services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fahrzeugmarkt
      POSTGRES_USER: fahrzeugmarkt
      POSTGRES_PASSWORD: fahrzeugmarkt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fahrzeugmarkt -d fahrzeugmarkt"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/fahrzeugmarkt
      DB_USER: fahrzeugmarkt
      DB_PASSWORD: fahrzeugmarkt
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    expose:
      - "8080"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
