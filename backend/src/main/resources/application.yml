spring:
  application:
    name: fahrzeugmarkt
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fahrzeugmarkt}
    username: ${DB_USER:fahrzeugmarkt}
    password: ${DB_PASSWORD:fahrzeugmarkt}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size-bytes: 5242880
    max-images-per-listing: 10

# Profile "local" supplies its own in-process PostgreSQL DataSource bean, so spring.datasource is unused there.
